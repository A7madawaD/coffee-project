<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <section class="container">
      <header class="head">
        <!-- start of nav bar -->
        <nav class="navbar">
          <img
            src="image/logo_coffetonw.png"
            class="logo"
            alt="Coffee Shop Logo"
          />
          <ul>
            <li><a class="active" href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
          </ul>
          <div class="nav-actions">
            <!-- أيقونة وحقل البحث بجانب بعضهما -->
            <div class="search-wrapper" id="searchWrapper">
              <i class="fa-solid fa-magnifying-glass" id="searchBtn"></i>
              <input
                type="text"
                id="searchInput"
                placeholder="Search coffee..."
              />
              <button id="closeSearch">&times;</button>
            </div>

            <button class="btn" id="signInBtn">Sign In</button>
          </div>
        </nav>
        <!-- end of nav bar -->
        <div class="text-area">
          <h1>Enjoy Your <span>Cup of Coffee</span></h1>

          <p>Don't let anyone ruin your coffee mood</p>
        </div>
      </header>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
